<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: head('Manage Categories - Admin')}"></head>
<body>

    <nav th:replace="~{layout/admin-layout :: admin-navbar}"></nav>

    <div class="admin-wrapper">
        <div th:replace="~{layout/admin-layout :: admin-sidebar('categories')}"></div>

        <div class="admin-content">
            <div th:replace="~{layout/main :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-0">Food Categories</h3>
                    <p class="text-muted small mb-0">Organize and structure the customer-facing menu catalog</p>
                </div>
                <button type="button" class="btn btn-primary-custom btn-sm" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="bi bi-plus-lg"></i> Add New Category
                </button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="text-muted small">
                            <tr>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Dishes Count</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td class="fw-bold" th:text="${cat.name}">Burgers</td>
                                <td class="small text-muted" th:text="${cat.description ?: 'No description'}">Desc</td>
                                <td>
                                    <span class="badge bg-secondary rounded-pill px-3" th:text="${cat.foodCount + ' Dishes'}">5 Dishes</span>
                                </td>
                                <td>
                                    <span th:if="${cat.isActive}" class="badge bg-success-subtle text-success">Active</span>
                                    <span th:unless="${cat.isActive}" class="badge bg-danger-subtle text-danger">Inactive</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary rounded-pill px-3" data-bs-toggle="modal"
                                            th:data-bs-target="${'#editCategoryModal' + cat.id}">
                                        <i class="bi bi-pencil"></i> Edit
                                    </button>
                                    <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to deactivate this category?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>

                                    <!-- Edit Category Modal -->
                                    <div class="modal fade" th:id="${'editCategoryModal' + cat.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content border-0 shadow rounded-4">
                                                <form th:action="@{/admin/categories/update/{id}(id=${cat.id})}" method="post">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                    <div class="modal-header border-0">
                                                        <h5 class="modal-title fw-bold">Edit Category</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <div class="mb-3">
                                                            <label class="form-label small fw-semibold">Category Name</label>
                                                            <input type="text" name="name" class="form-control" th:value="${cat.name}" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label small fw-semibold">Description</label>
                                                            <textarea name="description" class="form-control" rows="2" th:text="${cat.description}"></textarea>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label small fw-semibold">Image Asset URL</label>
                                                            <input type="text" name="imageUrl" class="form-control" th:value="${cat.imageUrl}">
                                                        </div>
                                                        <div class="form-check">
                                                            <input type="hidden" name="isActive" value="false">
                                                            <input class="form-check-input" type="checkbox" name="isActive" value="true" th:checked="${cat.isActive}" th:id="${'activeCheck' + cat.id}">
                                                            <label class="form-check-label small" th:for="${'activeCheck' + cat.id}">Active in Customer Catalog</label>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-0">
                                                        <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                                                        <button type="submit" class="btn btn-primary-custom btn-sm">Save Changes</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <form th:action="@{/admin/categories/add}" th:object="${categoryDto}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Create New Food Category</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Category Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Artisanal Pastas" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Brief summary of dishes in this section"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Image URL (Optional)</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="/images/categories/pastas.jpg">
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom btn-sm">Create Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
