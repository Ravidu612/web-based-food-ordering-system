<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('403 Access Denied - Foodie')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="text-center p-5" style="max-width: 500px;">
        <div class="rounded-circle bg-danger-subtle text-danger d-flex align-items-center justify-content-center mx-auto mb-4"
             style="width: 100px; height: 100px;">
            <i class="bi bi-shield-exclamation" style="font-size: 3rem;"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2">403 — Access Denied</h1>
        <p class="text-muted mb-4">
            You do not have the required permissions to access this restricted resource.
            This area is reserved for authorized administrators only.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary-custom px-4 py-2">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary px-4 py-2">
                <i class="bi bi-person-lock me-1"></i> Login
            </a>
        </div>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</body>
</html>
