<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Something Went Wrong - Foodie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="text-center p-5" style="max-width: 560px;">
        <div class="rounded-circle bg-warning-subtle text-warning d-flex align-items-center justify-content-center mx-auto mb-4"
             style="width: 100px; height: 100px;">
            <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
        </div>

        <!-- Dynamic HTTP Status Code -->
        <h1 class="fw-bold mb-1"
            th:text="${status ?: '500'} + ' — ' + (${errorTitle} ?: 'Internal Server Error')">
            500 — Internal Server Error
        </h1>

        <!-- Dynamic Error Message -->
        <p class="text-muted mb-2" th:text="${message ?: 'An unexpected error occurred on our server. Please try again shortly.'}">
            Unexpected error occurred.
        </p>

        <!-- Developer Debug (only shown in dev profile) -->
        <details th:if="${exception != null}" class="text-start mt-3 mb-4">
            <summary class="btn btn-sm btn-outline-secondary">Technical Details</summary>
            <div class="mt-2 p-3 bg-dark text-light rounded-3 small" style="overflow-x: auto;">
                <code th:text="${exception}">Exception details</code>
            </div>
        </details>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <a th:href="@{/}" class="btn btn-primary-custom px-4 py-2">
                <i class="bi bi-house-door me-1"></i> Back to Home
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </button>
        </div>

        <p class="small text-muted mt-4">
            If this problem persists, please contact our support team at
            <a href="mailto:support@foodie.com" class="text-decoration-none">support@foodie.com</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
