<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Create Account - Foodie')}"></head>
<body class="bg-light">

    <nav th:replace="~{layout/main :: navbar}"></nav>
    <div th:replace="~{layout/main :: alerts}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h4 class="mb-1 fw-bold"><i class="bi bi-person-plus text-warning"></i> Customer Registration</h4>
                        <p class="small text-muted mb-0">Join Foodie to order delicious meals</p>
                    </div>
                    <div class="card-body p-4 p-md-5">

                        <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold">First Name</label>
                                    <input type="text" th:field="*{firstName}" class="form-control" placeholder="John" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold">Last Name</label>
                                    <input type="text" th:field="*{lastName}" class="form-control" placeholder="Doe" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="john.doe@example.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Password (min 6 characters)</label>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+1-555-019-2831" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Primary Delivery Address</label>
                                    <textarea th:field="*{defaultDeliveryAddress}" class="form-control" rows="2" placeholder="Street name, building, apartment number" required></textarea>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('defaultDeliveryAddress')}" th:errors="*{defaultDeliveryAddress}"></div>
                                </div>

                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold">City</label>
                                    <input type="text" th:field="*{city}" class="form-control" placeholder="Los Angeles" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label fw-semibold">Postal / ZIP Code</label>
                                    <input type="text" th:field="*{postalCode}" class="form-control" placeholder="90024">
                                </div>

                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary-custom w-100 py-2">
                                        <i class="bi bi-check2-circle"></i> Create My Account
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="small text-muted mb-0">Already registered? <a th:href="@{/login}" class="text-primary fw-semibold">Log in here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
