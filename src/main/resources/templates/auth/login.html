<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Login - Foodie')}"></head>
<body class="bg-light">

    <nav th:replace="~{layout/main :: navbar}"></nav>
    <div th:replace="~{layout/main :: alerts}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h4 class="mb-1 fw-bold"><i class="bi bi-person-lock text-warning"></i> Welcome Back</h4>
                        <p class="small text-muted mb-0">Log in to your Foodie account</p>
                    </div>
                    <div class="card-body p-4 p-md-5">

                        <!-- Error alert on bad credentials -->
                        <div th:if="${param.error}" class="alert alert-danger border-0 small" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Invalid email or password. Please try again.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info border-0 small" role="alert">
                            <i class="bi bi-info-circle-fill"></i> You have been safely logged out.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary-custom w-100 py-2">
                                <i class="bi bi-box-arrow-in-right"></i> Sign In
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="small text-muted mb-0">Don't have an account? <a th:href="@{/register}" class="text-primary fw-semibold">Sign Up here</a></p>
                        </div>

                        <!-- Sample Credentials helper for presentation demo -->
                        <div class="mt-4 p-3 bg-light rounded-3 small border">
                            <strong class="text-secondary"><i class="bi bi-key-fill text-warning"></i> Seed Test Accounts:</strong><br>
                            <span class="text-muted">• Admin:</span> <code>admin@foodie.com</code> | <code>password123</code><br>
                            <span class="text-muted">• Customer:</span> <code>john.doe@example.com</code> | <code>password123</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
