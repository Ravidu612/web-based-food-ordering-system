<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Admin Back-Office - Foodie'">Admin Back-Office - Foodie</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Admin Top Navbar -->
    <nav class="navbar navbar-dark bg-dark sticky-top px-3 py-2 shadow-sm" th:fragment="admin-navbar">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white" th:href="@{/admin/dashboard}">
                <i class="bi bi-shield-lock-fill text-warning"></i> Foodie<span class="text-danger">Admin</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/}" target="_blank" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-up-right"></i> Live Storefront
                </a>
                <span class="text-light small"><i class="bi bi-person-badge"></i> <span sec:authentication="name">Admin</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Admin Sidebar Fragment -->
    <div class="admin-sidebar" th:fragment="admin-sidebar(activeTab)">
        <div class="sidebar-heading">Operations</div>
        <a th:href="@{/admin/dashboard}" class="sidebar-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-speedometer2"></i> Dashboard Overview
        </a>
        <a th:href="@{/admin/orders}" class="sidebar-link" th:classappend="${activeTab == 'orders' ? 'active' : ''}">
            <i class="bi bi-receipt"></i> Order Queue
        </a>
        <a th:href="@{/admin/inventory}" class="sidebar-link" th:classappend="${activeTab == 'inventory' ? 'active' : ''}">
            <i class="bi bi-box-seam"></i> Inventory & Stock
        </a>

        <div class="sidebar-heading mt-3">Menu Catalog</div>
        <a th:href="@{/admin/categories}" class="sidebar-link" th:classappend="${activeTab == 'categories' ? 'active' : ''}">
            <i class="bi bi-tags"></i> Food Categories
        </a>
        <a th:href="@{/admin/foods}" class="sidebar-link" th:classappend="${activeTab == 'foods' ? 'active' : ''}">
            <i class="bi bi-egg-fried"></i> Food Items
        </a>

        <div class="sidebar-heading mt-3">Financials & Reports</div>
        <a th:href="@{/admin/reports/sales}" class="sidebar-link" th:classappend="${activeTab == 'sales' ? 'active' : ''}">
            <i class="bi bi-graph-up-arrow"></i> Sales Reports
        </a>
        <a th:href="@{/admin/reports/profit}" class="sidebar-link" th:classappend="${activeTab == 'profit' ? 'active' : ''}">
            <i class="bi bi-cash-coin"></i> Profit & Loss Statement
        </a>
        <a th:href="@{/admin/reports/expenses}" class="sidebar-link" th:classappend="${activeTab == 'expenses' ? 'active' : ''}">
            <i class="bi bi-journal-text"></i> Operating Expenses
        </a>

        <div class="sidebar-heading mt-3">Users</div>
        <a th:href="@{/admin/customers}" class="sidebar-link" th:classappend="${activeTab == 'customers' ? 'active' : ''}">
            <i class="bi bi-people"></i> Registered Customers
        </a>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
