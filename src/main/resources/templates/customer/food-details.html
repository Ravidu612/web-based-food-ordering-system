<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(${food.name} + ' - Foodie')}"></head>
<body class="bg-light">

    <nav th:replace="~{layout/main :: navbar}"></nav>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container py-5">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-5">
            <div class="row g-0">
                <div class="col-lg-6">
                    <img th:src="${food.imageUrl ?: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80'}"
                         class="img-fluid w-100 h-100" style="object-fit: cover; min-height: 380px;" th:alt="${food.name}">
                </div>
                <div class="col-lg-6 p-4 p-md-5 d-flex flex-column justify-content-center">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge bg-primary-subtle text-primary fw-bold" th:text="${food.categoryName}">Category</span>
                        <span th:if="${food.isPromotional}" class="badge bg-danger" th:text="${food.discountPercentage + '% DISCOUNT'}">Promo</span>
                        <span class="badge bg-light text-dark"><i class="bi bi-clock"></i> <span th:text="${food.prepTimeMinutes + ' Mins Prep'}">15 Mins</span></span>
                    </div>

                    <h2 class="fw-bold mb-3" th:text="${food.name}">Dish Name</h2>
                    <p class="text-muted mb-4" th:text="${food.description}">Detailed culinary ingredients and preparation description.</p>

                    <div class="mb-4">
                        <span class="fs-2 fw-bold text-primary" th:text="${'$' + food.effectivePrice}">$14.99</span>
                        <span th:if="${food.isPromotional}" class="fs-5 text-muted text-decoration-line-through ms-2" th:text="${'$' + food.price}">$17.99</span>
                    </div>

                    <div class="p-3 bg-light rounded-3 mb-4 small">
                        <div class="row">
                            <div class="col-6">
                                <span class="text-muted">Stock Status:</span>
                                <strong th:text="${food.stockQuantity > 0 ? food.stockQuantity + ' Units Available' : 'Out of Stock'}"
                                        th:classappend="${food.stockQuantity > 0 ? 'text-success' : 'text-danger'}">In Stock</strong>
                            </div>
                            <div class="col-6">
                                <span class="text-muted">Kitchen Time:</span>
                                <strong>Approx. <span th:text="${food.prepTimeMinutes}">15</span> mins</strong>
                            </div>
                        </div>
                    </div>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/cart/add}" method="post" class="d-flex gap-3 align-items-center" th:if="${food.stockQuantity > 0}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="foodId" th:value="${food.id}">
                        <div style="width: 110px;">
                            <input type="number" name="quantity" class="form-control text-center py-2" value="1" min="1" th:max="${food.stockQuantity}" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom flex-grow-1 py-2">
                            <i class="bi bi-cart-plus me-1"></i> Add to Cart
                        </button>
                    </form>
                    <div th:unless="${food.stockQuantity > 0}" class="alert alert-warning mb-0">
                        <i class="bi bi-exclamation-triangle"></i> This item is currently sold out. Please check back later.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
