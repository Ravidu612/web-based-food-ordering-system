<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/main :: head('My Profile - FoodieExpress')}"></head>
<body>
<nav th:replace="~{layout/main :: navbar}"></nav>
<div th:replace="~{layout/main :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Profile Header -->
            <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="bg-dark text-white p-4 d-flex align-items-center gap-4">
                        <div class="rounded-circle bg-danger d-flex align-items-center justify-content-center"
                             style="width:72px;height:72px;font-size:2rem;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${customer.firstName + ' ' + customer.lastName}">Full Name</h4>
                            <p class="mb-0 text-muted small" th:text="${email}">email@example.com</p>
                            <span class="badge bg-danger mt-1">Customer</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edit Profile Form -->
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 p-4 pb-0">
                    <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square text-danger me-2"></i>Edit Profile</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/customer/profile}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">First Name</label>
                                <input type="text" name="firstName" class="form-control rounded-3"
                                       th:value="${customer.firstName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Last Name</label>
                                <input type="text" name="lastName" class="form-control rounded-3"
                                       th:value="${customer.lastName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control rounded-3 bg-light"
                                       th:value="${email}" disabled>
                                <small class="text-muted">Email cannot be changed.</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" name="phoneNumber" class="form-control rounded-3"
                                       th:value="${customer.phoneNumber}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Default Delivery Address</label>
                                <textarea name="defaultDeliveryAddress" class="form-control rounded-3" rows="2"
                                          required th:text="${customer.defaultDeliveryAddress}"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">City</label>
                                <input type="text" name="city" class="form-control rounded-3"
                                       th:value="${customer.city}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Postal Code</label>
                                <input type="text" name="postalCode" class="form-control rounded-3"
                                       th:value="${customer.postalCode}">
                            </div>
                        </div>

                        <hr class="my-4">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger px-4 rounded-pill">
                                <i class="bi bi-check-lg me-1"></i> Save Changes
                            </button>
                            <a th:href="@{/orders}" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="bi bi-bag-check me-1"></i> My Orders
                            </a>
                        </div>
                    </form>
                    
                    <!-- Logout Form (Separate from the update form to prevent nested forms) -->
                    <div class="d-flex justify-content-end mt-2">
                        <form th:action="@{/logout}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-danger rounded-pill px-4">
                                <i class="bi bi-box-arrow-right me-1"></i> Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{layout/main :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
